<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wishlist Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0A; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; overflow: hidden; }
        .tab-active { background: #fff; color: #000; font-weight: 600; }
        .tab-inactive { background: rgba(255,255,255,0.1); color: #aaa; }
        .cat-active { border-bottom: 2px solid #fff; color: #fff; }
        .cat-inactive { color: rgba(255,255,255,0.4); }
        /* Прячем скроллбар для красоты */
        ::-webkit-scrollbar { width: 0px; height: 0px; }
    </style>
</head>
<body class="p-4 pb-24">

    <!-- Header и переключатель пользователей -->
    <header class="mb-6 pt-2">
        <h1 class="text-3xl font-bold tracking-tight mb-4">Wishlist</h1>
        <div class="flex gap-2 p-1 bg-white/5 rounded-2xl w-full">
            <button onclick="setUserFilter('all')" id="u-all" class="flex-1 py-2 rounded-xl tab-active transition-all text-sm">Всё вместе</button>
            <button onclick="setUserFilter('me')" id="u-me" class="flex-1 py-2 rounded-xl tab-inactive transition-all text-sm">Мои</button>
            <button onclick="setUserFilter('partner')" id="u-partner" class="flex-1 py-2 rounded-xl tab-inactive transition-all text-sm">Партнера</button>
        </div>
    </header>

    <!-- Фильтр категорий -->
    <div class="flex gap-6 mb-6 text-sm font-medium overflow-x-auto pb-2 whitespace-nowrap">
        <button onclick="setCatFilter('all')" id="c-all" class="pb-1 cat-active transition-all">Все</button>
        <button onclick="setCatFilter('gift')" id="c-gift" class="pb-1 cat-inactive transition-all">Подарки 🎁</button>
        <button onclick="setCatFilter('food')" id="c-food" class="pb-1 cat-inactive transition-all">Рестораны 🍴</button>
        <button onclick="setCatFilter('place')" id="c-place" class="pb-1 cat-inactive transition-all">Места 📍</button>
        <button onclick="setCatFilter('goodies')" id="c-goodies" class="pb-1 cat-inactive transition-all">Ништяки 🍬</button>
    </div>

    <!-- Сетка карточек -->
    <div id="wishlist" class="grid grid-cols-2 gap-4">
        <!-- Карточки -->
    </div>

    <!-- Кнопка добавления -->
    <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-white text-black rounded-full shadow-lg shadow-white/20 flex items-center justify-center active:scale-90 transition-transform z-40">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Модалка -->
    <div id="modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col pt-10 px-4 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Добавить</h2>
            <button onclick="closeModal()" class="p-2 bg-white/10 rounded-full"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>

        <!-- Выбор категории в модалке -->
        <select id="modal-category" onchange="updateModalFields()" class="w-full bg-white/10 border border-white/10 rounded-2xl p-4 mb-4 outline-none text-lg appearance-none">
            <option value="gift">Подарок 🎁</option>
            <option value="food">Ресторан 🍴</option>
            <option value="place">Место 📍</option>
            <option value="goodies">Ништяк 🍬</option>
        </select>

        <input id="m-title" type="text" placeholder="Название..." class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 mb-4 outline-none focus:border-white/30 text-lg">
        
        <!-- Динамические поля -->
        <div id="field-image" class="mb-4">
            <label class="block text-xs text-white/50 mb-2 uppercase tracking-wide">Фотография</label>
            <input type="file" id="m-image" accept="image/*" class="w-full text-sm text-white/50 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-white/10 file:text-white">
        </div>

        <div id="field-price" class="mb-4">
            <label class="block text-xs text-white/50 mb-2 uppercase tracking-wide" id="label-price">Цена</label>
            <input id="m-price" type="text" placeholder="Например: 5000 ₽" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none">
        </div>

        <div id="field-link" class="mb-4 hidden">
            <label class="block text-xs text-white/50 mb-2 uppercase tracking-wide">Ссылка (на товар или меню)</label>
            <input id="m-link" type="url" placeholder="https://..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none text-blue-400">
        </div>

        <div id="field-location" class="mb-4 hidden">
            <label class="block text-xs text-white/50 mb-2 uppercase tracking-wide">Точка на карте (ссылка)</label>
            <input id="m-location" type="url" placeholder="Ссылка на Яндекс/Google карты" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none text-green-400">
        </div>

        <div id="field-desire" class="mb-8">
            <label class="block text-xs text-white/50 mb-2 uppercase tracking-wide">Уровень желания</label>
            <div class="flex gap-2">
                <button onclick="setDesire(1)" class="desire-btn flex-1 py-2 rounded-xl bg-white/10 text-xl border border-transparent">🔥</button>
                <button onclick="setDesire(2)" class="desire-btn flex-1 py-2 rounded-xl bg-white/10 text-xl border border-transparent">🔥🔥</button>
                <button onclick="setDesire(3)" class="desire-btn flex-1 py-2 rounded-xl bg-white/10 text-xl border border-transparent">🔥🔥🔥</button>
            </div>
        </div>

        <button onclick="saveItem()" id="saveBtn" class="w-full p-4 rounded-2xl bg-white text-black font-bold text-lg mb-10 active:scale-95 transition-transform">Сохранить в хотелки</button>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const SB_URL = 'https://gsjozmgbwuglqevjxuaj.supabase.co';
        const SB_KEY = 'sb_publishable_NkwRATYjXxOox-HSnLd4xg_06Ds2vzH';
        
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0A0A0A';
        tg.backgroundColor = '#0A0A0A';

        const myName = tg.initDataUnsafe.user?.first_name || 'Я';

        // Состояния
        let userFilter = 'all'; // all, me, partner
        let catFilter = 'all';  // all, gift, food, place, goodies
        let currentDesire = 1;

        async function loadItems() {
            let query = supabaseClient.from('items').select('*').order('created_at', { ascending: false });
            
            // Фильтр по категории
            if (catFilter !== 'all') query = query.eq('category', catFilter);
            
            const { data, error } = await query;
            if (error) return console.error(error);

            // Фильтр по пользователю (делаем на клиенте для простоты)
            let filteredData = data;
            if (userFilter === 'me') {
                filteredData = data.filter(item => item.added_by === myName);
            } else if (userFilter === 'partner') {
                filteredData = data.filter(item => item.added_by !== myName);
            }

            render(filteredData);
        }

        function render(items) {
            const list = document.getElementById('wishlist');
            if (items.length === 0) {
                list.className = "mt-20 text-center";
                list.innerHTML = `<div class="text-white/30">Ничего не найдено 🤷‍♂️</div>`;
                return;
            }

            list.className = "grid grid-cols-2 gap-4"; // Возвращаем сетку
            list.innerHTML = items.map(item => `
                <div class="glass-card flex flex-col relative ${item.is_completed ? 'opacity-30 grayscale' : ''}">
                    ${item.image_url ? 
                        `<div class="h-32 w-full bg-cover bg-center" style="background-image: url('${item.image_url}')"></div>` : 
                        `<div class="h-32 w-full bg-white/5 flex items-center justify-center text-4xl">${getCatData(item.category).emoji}</div>`
                    }
                    
                    <div class="p-3 flex flex-col flex-grow">
                        <div class="text-xs text-white/50 mb-1 flex justify-between">
                            <span>${item.added_by === myName ? 'Моё' : 'Её'}</span>
                            ${item.desire_level ? '🔥'.repeat(item.desire_level) : ''}
                        </div>
                        <div class="font-semibold text-sm mb-2 leading-tight">${item.title}</div>
                        ${item.price ? `<div class="text-xs font-bold text-green-400 mb-2">${item.price}</div>` : ''}
                        
                        <div class="mt-auto flex gap-2">
                            ${item.link ? `<a href="${item.link}" target="_blank" class="flex-1 bg-white/10 text-center py-1.5 rounded-lg text-xs hover:bg-white/20">Ссылка</a>` : ''}
                            ${item.location ? `<a href="${item.location}" target="_blank" class="flex-1 bg-blue-500/20 text-blue-300 text-center py-1.5 rounded-lg text-xs hover:bg-blue-500/40">Карта</a>` : ''}
                        </div>
                    </div>
                    
                    <button onclick="toggleStatus('${item.id}', ${item.is_completed})" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/50 backdrop-blur-md border ${item.is_completed ? 'border-green-400 text-green-400' : 'border-white/20 text-white/50'} flex items-center justify-center">
                        ✓
                    </button>
                </div>
            `).join('');
        }

        // --- УПРАВЛЕНИЕ UI ---

        function setUserFilter(f) {
            userFilter = f;
            ['all', 'me', 'partner'].forEach(id => {
                document.getElementById('u-'+id).className = "flex-1 py-2 rounded-xl tab-inactive transition-all text-sm";
            });
            document.getElementById('u-'+f).className = "flex-1 py-2 rounded-xl tab-active transition-all text-sm";
            loadItems();
        }

        function setCatFilter(f) {
            catFilter = f;
            ['all', 'gift', 'food', 'place', 'goodies'].forEach(id => {
                document.getElementById('c-'+id).className = "pb-1 cat-inactive transition-all";
            });
            document.getElementById('c-'+f).className = "pb-1 cat-active transition-all";
            loadItems();
        }

        function setDesire(level) {
            currentDesire = level;
            const btns = document.querySelectorAll('.desire-btn');
            btns.forEach((b, i) => {
                b.className = `desire-btn flex-1 py-2 rounded-xl text-xl border transition-all ${i+1 === level ? 'bg-white/20 border-white/50 scale-105' : 'bg-white/5 border-transparent'}`;
            });
        }

        function getCatData(c) {
            const data = {
                'gift': { emoji: '🎁' },
                'food': { emoji: '🍴' },
                'place': { emoji: '📍' },
                'goodies': { emoji: '🍬' }
            };
            return data[c] || { emoji: '✨' };
        }

        // --- ЛОГИКА ДОБАВЛЕНИЯ (ДИНАМИКА) ---

        function updateModalFields() {
            const cat = document.getElementById('modal-category').value;
            
            // Сбрасываем видимость
            document.getElementById('field-image').classList.remove('hidden');
            document.getElementById('field-link').classList.remove('hidden');
            document.getElementById('field-price').classList.remove('hidden');
            document.getElementById('field-location').classList.add('hidden');
            document.getElementById('field-desire').classList.add('hidden');

            const priceLabel = document.getElementById('label-price');

            if (cat === 'gift') {
                document.getElementById('field-desire').classList.remove('hidden');
                priceLabel.innerText = "Цена";
            } else if (cat === 'food') {
                document.getElementById('field-location').classList.remove('hidden');
                document.getElementById('field-image').classList.add('hidden');
                priceLabel.innerText = "Средний чек (на человека)";
            } else if (cat === 'place') {
                document.getElementById('field-location').classList.remove('hidden');
                document.getElementById('field-image').classList.add('hidden');
                priceLabel.innerText = "Стоимость (если есть)";
            } else if (cat === 'goodies') {
                priceLabel.innerText = "Цена";
            }
        }

        async function saveItem() {
            const title = document.getElementById('m-title').value;
            if (!title) { alert('Название обязательно!'); return; }

            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Загрузка...';
            btn.disabled = true;

            const cat = document.getElementById('modal-category').value;
            const price = document.getElementById('m-price').value;
            const link = document.getElementById('m-link').value;
            const location = document.getElementById('m-location').value;
            
            let imageUrl = null;
            
            // Обработка загрузки фото
            const fileInput = document.getElementById('m-image');
            if (fileInput.files.length > 0 && !document.getElementById('field-image').classList.contains('hidden')) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                
                // Загружаем в Supabase Storage
                const { error: uploadError } = await supabaseClient.storage.from('images').upload(fileName, file);
                if (!uploadError) {
                    const { data } = supabaseClient.storage.from('images').getPublicUrl(fileName);
                    imageUrl = data.publicUrl;
                } else {
                    console.error("Ошибка загрузки фото:", uploadError);
                }
            }

            // Записываем в базу
            const payload = {
                title,
                category: cat,
                added_by: myName,
                price: price || null,
                link: link || null,
                location: location || null,
                image_url: imageUrl,
                desire_level: cat === 'gift' ? currentDesire : null
            };

            await supabaseClient.from('items').insert([payload]);

            // Очистка формы
            document.getElementById('m-title').value = '';
            document.getElementById('m-price').value = '';
            document.getElementById('m-link').value = '';
            document.getElementById('m-location').value = '';
            fileInput.value = '';
            setDesire(1);
            
            closeModal();
            loadItems();
            tg.HapticFeedback.notificationOccurred('success');
            
            btn.innerText = 'Сохранить в хотелки';
            btn.disabled = false;
        }

        async function toggleStatus(id, current) {
            await supabaseClient.from('items').update({ is_completed: !current }).eq('id', id);
            tg.HapticFeedback.impactOccurred('light');
            loadItems();
        }

        function openModal() { 
            document.getElementById('modal').classList.remove('hidden'); 
            updateModalFields(); // Обновляем поля под текущую выбранную категорию
            setDesire(1);
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        // Realtime
        supabaseClient.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, loadItems).subscribe();

        // Старт
        loadItems();
    </script>
</body>
</html>
